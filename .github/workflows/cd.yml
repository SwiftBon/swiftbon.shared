# Release swiftbon.com/shared.
#
# A Go module is published by its git tag: consumers fetch the tagged commit
# straight from this repository, and GitHub Packages has no Go registry to push
# to. So releasing means: pick the next semver tag, prove the commit passes the
# same gate as `make check`, and only then create the tag and a GitHub Release.
#
# Run it from the Actions tab ("Run workflow" on main, choose the bump). The
# tag is created by this job after the checks pass, never before, so a version
# a consumer can resolve is always one that passed. Do not push v* tags by hand:
# that skips the gate.

name: cd

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every tag, to find the latest release

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::releases are cut from main only; this run is on $GITHUB_REF"
            exit 1
          fi

          latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v${major}.${minor}.${patch}"

          # From v2 on, Go requires the major version in the module path
          # (swiftbon.com/shared/v2). Without it the tag cannot be required.
          module=$(go mod edit -json | jq -r .Module.Path)
          if [ "$major" -ge 2 ] && [[ "$module" != */v"$major" ]]; then
            echo "::error::$tag needs the module path to end in /v$major (go.mod declares $module)"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"
            exit 1
          fi

          echo "latest release: $latest -> $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: go.mod is tidy and dependencies verify
        run: |
          go mod tidy -diff
          go mod verify

      - name: gofmt
        run: make fmt-check

      - name: Build, vet, test with -race, coverage gate
        run: make check

      - name: Tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > notes.md <<EOF
          ## Use it

          \`\`\`
          // go.mod
          require swiftbon.com/shared v0.0.0

          replace swiftbon.com/shared => github.com/${GITHUB_REPOSITORY} ${TAG}
          \`\`\`

          or, in a repo already on the module:

          \`\`\`sh
          go mod edit -replace=swiftbon.com/shared=github.com/${GITHUB_REPOSITORY}@${TAG} && go mod tidy
          \`\`\`
          EOF
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --generate-notes
